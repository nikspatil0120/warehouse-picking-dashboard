# Development Profile Configuration
# This profile is for local development only.
# Use this by running: mvn spring-boot:run -Dspring.profiles.active=dev

# MongoDB embedded for development (via spring-boot-starter-data-mongodb)
# Spring Boot will auto-configure embedded MongoDB when on test classpath
# For persistent local MongoDB, uncomment:
# spring.data.mongodb.uri=mongodb://localhost:27017/warehouse

# Allow SampleUserLoader to run
spring.profiles.active=dev
