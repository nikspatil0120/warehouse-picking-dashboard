<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access Denied</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #172554 0%, #4f46e5 100%);
        }
        
        .error-card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 60px 40px;
            text-align: center;
        }
        
        .error-code {
            font-size: 72px;
            color: #991b1b;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .error-title {
            font-size: 24px;
            color: #172554;
            margin-bottom: 15px;
        }
        
        .error-message {
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        .btn {
            display: inline-block;
            padding: 11px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="error-page">
    <div class="error-card">
        <div class="error-code">403</div>
        <h1 class="error-title">Access Denied</h1>
        <p class="error-message">
            You do not have permission to access this resource.
            <br>
            If you believe this is an error, please contact your administrator.
        </p>
        <div class="error-actions">
            <a th:href="@{/}" class="btn btn-primary">Go to Home</a>
            <a th:href="@{/logout}" class="btn btn-secondary">Log Out</a>
        </div>
    </div>
</div>
</body>
</html>
