<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <script>!function(){var t=localStorage.getItem("wh-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light")}();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Denied — Warehouse Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      padding: 20px;
    }
    .error-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(0,0,0,.3);
      width: 100%;
      max-width: 480px;
      padding: 56px 40px 48px;
      text-align: center;
    }
    .error-code {
      font-size: 80px;
      font-weight: 800;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 8px;
    }
    .error-icon { font-size: 52px; margin-bottom: 16px; display: block; }
    .error-title { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 12px; }
    .error-msg { color: #64748b; font-size: 14.5px; line-height: 1.65; margin-bottom: 32px; }
    .error-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
<div class="error-page">
  <div class="error-card">
    <span class="error-icon">🔒</span>
    <div class="error-code">403</div>
    <h1 class="error-title">Access Denied</h1>
    <p class="error-msg">
      You don't have permission to view this page.<br>
      If you think this is a mistake, contact your administrator.
    </p>
    <div class="error-actions">
      <a th:href="@{/}" class="btn btn-primary">Go to Dashboard</a>
      <a th:href="@{/logout}" class="btn btn-secondary">Sign Out</a>
    </div>
  </div>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
