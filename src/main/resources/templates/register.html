<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Warehouse Picking Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #172554 0%, #4f46e5 100%);
        }
        
        .register-card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }
        
        .register-card h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .register-card p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .register-form input {
            margin-bottom: 15px;
        }
        
        .register-form input:last-of-type {
            margin-bottom: 0;
        }
        
        .btn-register {
            width: 100%;
            margin-top: 20px;
        }
        
        .alert {
            margin-bottom: 20px;
        }
        
        .register-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }
        
        .register-footer a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }
        
        .register-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-card">
        <h1>Create Account</h1>
        <p>Register as a customer to place orders</p>

        <div class="alert success" th:if="${message}" th:text="${message}"></div>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form class="register-form" method="post" th:action="@{/register}" th:object="${registrationForm}">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" th:field="*{username}" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" name="email" th:field="*{email}" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" th:field="*{password}" required>
            </div>

            <div class="form-group">
                <label for="passwordConfirm">Confirm Password</label>
                <input id="passwordConfirm" type="password" name="passwordConfirm" th:field="*{passwordConfirm}" required>
            </div>

            <button class="btn btn-primary btn-register" type="submit">Create Account</button>
        </form>

        <div class="register-footer">
            <p>Already have an account? <a th:href="@{/login}">Sign in</a></p>
        </div>
    </div>
</div>
</body>
</html>
