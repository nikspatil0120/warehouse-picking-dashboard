<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <script>!function(){var t=localStorage.getItem("wh-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light")}();</script>
  <script>!function(){var t=localStorage.getItem("wh-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light")}();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account — Warehouse Picking Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Floating theme toggle for auth pages -->
<button class="theme-toggle-float" onclick="document.documentElement.getAttribute('data-theme')==='light'?(document.documentElement.removeAttribute('data-theme'),localStorage.setItem('wh-theme','dark')):(document.documentElement.setAttribute('data-theme','light'),localStorage.setItem('wh-theme','light'));this.querySelector('.ftl').textContent=document.documentElement.getAttribute('data-theme')==='light'?'🌙':'☀️'" aria-label="Toggle theme">
  <span class="ftl">☀️</span>
</button>

<div class="register-container">
  <div class="register-card">

    <div class="register-header">
      <div style="font-size:40px; margin-bottom:12px;">📦</div>
      <h1>Create an Account</h1>
      <p>Register as a customer to browse the catalogue and place orders.</p>
    </div>

    <div class="alert success" th:if="${message}">✅ <span th:text="${message}"></span></div>
    <div class="alert error"   th:if="${error}">❌ <span th:text="${error}"></span></div>

    <form class="register-form" method="post" th:action="@{/register}" th:object="${registrationForm}">

      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" th:field="*{username}" placeholder="e.g. jsmith" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" name="email" th:field="*{email}" placeholder="you@company.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" th:field="*{password}" placeholder="At least 6 characters" required>
      </div>

      <div class="form-group">
        <label for="passwordConfirm">Confirm Password</label>
        <input id="passwordConfirm" type="password" name="passwordConfirm" th:field="*{passwordConfirm}" placeholder="Repeat password" required>
      </div>

      <button class="btn btn-primary" style="width:100%; justify-content:center; padding:12px; font-size:15px; margin-top:8px; border-radius:10px;" type="submit">
        Create Account →
      </button>
    </form>

    <div class="login-footer-link" style="margin-top:20px; padding-top:18px; border-top:1px solid #e2e8f0;">
      Already have an account? <a th:href="@{/login}">Sign in</a>
    </div>

  </div>
</div>

<script th:src="@{/js/theme.js}"></script>
</body>
</html>
