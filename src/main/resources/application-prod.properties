# Production Profile Configuration
# Use this by running with: java -Dspring.profiles.active=prod -jar picking-dashboard.war
# Or set environment variable: SPRING_PROFILES_ACTIVE=prod

# MongoDB production configuration
# Requires MONGO_URI environment variable for security
spring.data.mongodb.uri=${MONGO_URI}

# Session cookie security
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Disable actuator endpoints except health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
